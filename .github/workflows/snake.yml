name: snake
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff8c00&color_dots=#ebedf0,#ffe0a3,#ffc300,#ff8c00,#ff4e00
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffc300&color_dots=#161b22,#5c2a00,#a34700,#ff8c00,#ffc300
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
