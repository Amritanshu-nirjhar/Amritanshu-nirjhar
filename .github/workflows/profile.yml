name: profile
on:
  schedule: [{ cron: "0 */12 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions: { contents: write }
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=#ff8c00&color_dots=#ebedf0,#ffe0a3,#ffc300,#ff8c00,#ff4e00
            dist/snake-dark.svg?palette=github-dark&color_snake=#ffc300&color_dots=#161b22,#5c2a00,#a34700,#ff8c00,#ffc300
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/3d-settings.json
      - run: cp profile-3d-contrib/skyline.svg dist/
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  recent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: gh api "users/${{ github.repository_owner }}/repos?sort=pushed&per_page=15" > /tmp/repos.json
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - run: python3 .github/recent.py /tmp/repos.json README.md
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Update recently shipped" && git push || echo "no change"
